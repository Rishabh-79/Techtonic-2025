<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – BrandStorm | Techtonic 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='mainstyle.css') }}">
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <div class="logo">Techtonic 2026</div>
        <div class="menu-toggle" id="menu-toggle">
            <span></span><span></span><span></span>
        </div>
        <ul id="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/#about">About</a></li>
            <li><a href="/#schedule">Schedule</a></li>
            <li><a href="/#contact">Contact</a></li>
        </ul>
    </nav>

    <div class="C_name">
        <section id="Register">
            <h2>Register – BrandStorm: Ad Zap</h2>
            <form action="/registerazp" method="POST" id="Registration-form">
                <div>
                    <label>Name 1: <span style="color:#aaa;font-weight:400;">(Required)</span></label>
                    <input type="text" name="Name1" required />
                </div>
                <div>
                    <label>Name 2: <span style="color:#aaa;font-weight:400;">(Required)</span></label>
                    <input type="text" name="Name2" required />
                </div>
                <div>
                    <label>Name 3: <span style="color:#aaa;font-weight:400;">(Optional)</span></label>
                    <input type="text" name="Name3" />
                </div>
                <div>
                    <label>Name 4: <span style="color:#aaa;font-weight:400;">(Optional)</span></label>
                    <input type="text" name="Name4" />
                </div>
                <div>
                    <label>Name 5: <span style="color:#aaa;font-weight:400;">(Optional)</span></label>
                    <input type="text" name="Name5" />
                </div>
                <div>
                    <label>Email ID: <span style="color:#aaa;font-weight:400;">(Required)</span></label>
                    <input type="email" name="mailid" required />
                </div>
                <div>
                    <label>WhatsApp Number: <span style="color:#aaa;font-weight:400;">(Required)</span></label>
                    <input type="tel" name="phone" required />
                </div>
                <div>
                    <label>Department: <span style="color:#aaa;font-weight:400;">(Required)</span></label>
                    <input type="text" name="Dept" required />
                </div>
                <div>
                    <label>College: <span style="color:#aaa;font-weight:400;">(Required)</span></label>
                    <input type="text" name="Clg" id="Clg" required />
                </div>
                <div>
                    <label>Event:</label>
                    <select name="Event" id="Events">
                        <option value="BrandStorm – Ad Zap">BrandStorm – Ad Zap</option>
                    </select>
                </div>
                <div style="margin-top:8px;">
                    <input type="submit" value="Register Now">
                </div>
            </form>
        </section>
    </div>

    <!-- Footer -->
    <footer>
        &copy; 2026 Department of Computer Science – Madras Christian College
    </footer>

    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const navLinks   = document.getElementById('nav-links');
        menuToggle.addEventListener('click', () => navLinks.classList.toggle('show'));
    </script>

</body>

</html>
